<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Lawrence Hsiung</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="page-enter-from-right">
    <header>
      <h1>Portfolio</h1>

      <div class="top-icons">
        <!-- Home -->
        <a
          href="index.html"
          class="icon-link"
          data-label="Home"
          aria-label="Home"
        >
          <svg
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9.5L12 3l9 6.5" fill="none" stroke="currentColor" />
            <path
              d="M5 10v10h5v-6h4v6h5V10"
              fill="none"
              stroke="currentColor"
            />
          </svg>
        </a>

        <!-- LinkedIn -->
        <a
          href="https://linkedin.com/in/lhsiung"
          class="icon-link"
          data-label="LinkedIn"
          aria-label="LinkedIn"
          target="_blank"
        >
          <svg
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="2"
              fill="none"
              stroke="currentColor"
            />
            <line x1="8" y1="10" x2="8" y2="16" stroke="currentColor" />
            <circle cx="8" cy="7" r="1" fill="none" stroke="currentColor" />
            <path
              d="M12 16v-4c0-1.5 3-1.6 3 0v4"
              fill="none"
              stroke="currentColor"
            />
          </svg>
        </a>

        <!-- Resume -->
        <a
          href="Lawrence_Hsiung_Resume.pdf"
          class="icon-link"
          data-label="Resume"
          aria-label="Resume"
          target="_blank"
        >
          <svg
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2h9l5 5v15H6z" fill="none" stroke="currentColor" />
            <path d="M14 2v5h5" fill="none" stroke="currentColor" />
            <line x1="9" y1="13" x2="15" y2="13" stroke="currentColor" />
            <line x1="9" y1="17" x2="15" y2="17" stroke="currentColor" />
          </svg>
        </a>
      </div>
    </header>

    <main>
      <section id="companies">
        <article class="company">
          <div class="company-header">
            <img
              src="images/lucidlogo copy.png"
              alt="Lucid Motors logo"
              class="company-logo invert-logo"
            />
            <h2>Lucid Motors — Prototypes and Concepts Systems Engineer</h2>
          </div>
          <div class="company-gallery">
            <div class="company-image" data-label="Lucid Cosmos Concept">
              <img src="images/cosmosint.avif" alt="Lucid Cosmos Concept" />
            </div>
            <div class="company-image" data-label="Lunar Robotaxi Concept">
              <img src="images/lucidlunar.png" alt="Lucid Lunar Concept" />
            </div>
            <div class="company-image" data-label="Lucid Gravity x Uber x Nuro Robotaxi Concept">
              <img
                src="images/ubergravity.avif" data-label="Lucid Gravity x Uber x Nuro"/>
            </div>
          </div>
        </article>

        <article class="company">
          <div class="company-header">
            <img
              src="images/farmwise.png"
              alt="Farmwise Labs logo"
              class="company-logo"
            />
            <h2>Farmwise Labs — Product & Systems Engineer</h2>
          </div>
          <div class="company-gallery">
            <div class="company-image" data-label="Vulcan Smart Weeding Robot">
              <img src="images/farmwisevulcan.jpg" alt="Farmwise Vulcan" />
            </div>
            <div class="company-image" data-label="IPS Box">
              <img src="images/ipsbox.png" alt="Farmwise IPS Box" />
            </div>
          </div>
        </article>

        <article class="company">
          <div class="company-header">
            <img
              src="images/zlogo.png"
              alt="Zoom logo"
              class="company-logo"
            />
            <h2>Zoom— Audio Test Engineer</h2>
          </div>
          <div class="company-gallery">
            <div class="company-image" data-label="Zoom Hardware Certification">
              <img src="images/zcert3.webp" alt="Zoom Hardware Certification" />
            </div>
          </div>
        </article>


        <article class="company">
          <div class="company-header">
            <img
              src="images/fitbitlogowhite.png" 
              alt="Fitbit logo"
              class="company-logo"
            />
            <h2>Fitbit— Electrical Engineering Technician</h2>
          </div>
          <div class="company-gallery">
            <div class="company-image" data-label="Fitbit Versa 1, 2, & 3 Validation Testing">
              <img src="images/versa2.jpg" alt="Fitbit Device Testing" />
            </div>
            <div class="company-image" data-label="Fitbit Inspire HR & Inspire Validation Testing">
              <img src="images/inspirehr.webp" alt="Fitbit Device Testing" />
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer>© 2026 Lawrence Hsiung</footer>

    <script>
      document.querySelectorAll("a").forEach((link) => {
        if (link.href.includes("index.html")) {
          link.addEventListener("click", function (e) {
            e.preventDefault();

            /* Force instant animation start */
            void document.body.offsetWidth;

            document.body.classList.add("page-exit-left");

            setTimeout(() => {
              window.location = this.href;
            }, 550);
          });
        }
      });
    </script>
  </body>
</html>
