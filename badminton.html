<script>
// Light / dark toggle, remembered per visitor
(function () {
  const root = document.documentElement;
  const btn = document.querySelector('.theme-toggle');
  const isDark = () => root.dataset.theme
    ? root.dataset.theme === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  const sync = () => btn && btn.setAttribute('aria-pressed', String(isDark()));
  if (btn) {
    btn.addEventListener('click', () => {
      root.dataset.theme = isDark() ? 'light' : 'dark';
      try { localStorage.setItem('lh-theme', root.dataset.theme); } catch (e) {}
      sync();
    });
  }
  sync();
})();

// Gentle reveal on scroll
(function () {
  const els = document.querySelectorAll('.rise');
  if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12 });
  els.forEach(e => io.observe(e));
})();

// Lightbox for portfolio images
(function () {
  const dlg = document.querySelector('dialog.viewer');
  if (!dlg) return;
  const img = dlg.querySelector('img');
  const cap = dlg.querySelector('.cap');
  document.querySelectorAll('[data-view]').forEach(b => {
    b.addEventListener('click', () => {
      const src = b.querySelector('img');
      img.src = src.src;
      img.alt = src.alt;
      cap.textContent = b.dataset.view;
      dlg.showModal();
    });
  });
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg || e.target.closest('.close')) dlg.close();
  });
})();
</script>
