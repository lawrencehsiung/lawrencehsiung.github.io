<script>
// Light / dark toggle, remembered per visitor
(function () {
  const root = document.documentElement;
  const btn = document.querySelector('.theme-toggle');
  const isDark = () => root.dataset.theme
    ? root.dataset.theme === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  const sync = () => btn && btn.setAttribute('aria-pressed', String(isDark()));
  if (btn) {
    btn.addEventListener('click', () => {
      root.dataset.theme = isDark() ? 'light' : 'dark';
      try { localStorage.setItem('lh-theme', root.dataset.theme); } catch (e) {}
      sync();
    });
  }
  sync();
})();

// Gentle reveal on scroll
(function () {
  const els = document.querySelectorAll('.rise');
  if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12 });
  els.forEach(e => io.observe(e));
})();

// Lightbox for portfolio images
(function () {
  const dlg = document.querySelector('dialog.viewer');
  if (!dlg) return;
  const img = dlg.querySelector('img');
  const cap = dlg.querySelector('.cap');
  document.querySelectorAll('[data-view]').forEach(b => {
    b.addEventListener('click', () => {
      const src = b.querySelector('img');
      img.src = src.src;
      img.alt = src.alt;
      cap.textContent = b.dataset.view;
      dlg.showModal();
    });
  });
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg || e.target.closest('.close')) dlg.close();
  });
})();
</script>
<script>
// Placeholder watches tell the real time
(function () {
  const faces = document.querySelectorAll('.slot .face');
  const dates = document.querySelectorAll('.cdate');
  const tick = () => {
    const d = new Date();
    dates.forEach(el => { const n = String(d.getDate()); if (el.textContent !== n) el.textContent = n; });
    const sec = d.getSeconds(), min = d.getMinutes() + sec / 60, hr = (d.getHours() % 12) + min / 60;
    faces.forEach(f => {
      if (!f.hasAttribute('data-sweep') && !f.hasAttribute('data-beats')) f.querySelector('.s').style.setProperty('--a', sec * 6 + 'deg');
      f.querySelector('.m').style.setProperty('--a', min * 6 + 'deg');
      f.querySelector('.h').style.setProperty('--a', hr * 30 + 'deg');
    });
  };
  tick();
  setInterval(tick, 1000);
  // Spring Drive glides; mechanical movements step at their beat rate (3 Hz = 6 beats/s)
  const sweep = [...document.querySelectorAll('.face[data-sweep] .s')];
  const beat = [...document.querySelectorAll('.face[data-beats]')].map(f => [f.querySelector('.s'), +f.dataset.beats]);
  if (sweep.length || beat.length) {
    const glide = () => {
      const d = new Date();
      const s = d.getSeconds() + d.getMilliseconds() / 1000;
      sweep.forEach(el => el.style.setProperty('--a', s * 6 + 'deg'));
      beat.forEach(([el, n]) => el.style.setProperty('--a', Math.floor(s * n) / n * 6 + 'deg'));
      requestAnimationFrame(glide);
    };
    requestAnimationFrame(glide);
  }
})();
</script>
